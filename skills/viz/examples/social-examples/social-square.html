<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8" />
    <title>Social square example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: var(--font-sans);
      }
      .dark {
        color-scheme: dark;
      }
      body {
        width: 1080px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
      }
      .frame {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 96px 64px 56px;
      }
      .eyebrow {
        color: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 21px;
      }
      h1 {
        margin: 14px 0 0;
        max-width: 940px;
        font-size: 58px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 26px;
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
        font-family: var(--font-mono);
        font-size: 22px;
        color: hsl(var(--foreground));
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 999px;
      }
      .plot {
        margin-top: 26px;
        width: 952px;
        height: 600px;
        overflow: visible;
      }
      .plot-tall {
        height: 760px;
      }
      .marker-rule {
        stroke: hsl(var(--muted-foreground));
        stroke-width: 3;
        stroke-dasharray: 12 8;
      }
      .gridline {
        stroke: hsl(var(--muted-foreground));
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
      .axis-line {
        stroke: hsl(var(--border));
      }
      .axis-label {
        fill: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 24px;
      }
      .value-label {
        fill: hsl(var(--foreground));
        font-size: 46px;
        font-weight: 700;
      }
      .callout {
        fill: hsl(var(--foreground));
        font-size: 30px;
        font-weight: 700;
      }
      .b0 { background: var(--chart-1); }
      .b1 { background: var(--chart-2); }
      .b2 { background: var(--chart-3); }
      .b3 { background: var(--chart-4); }
      .b-neutral { background: var(--chart-other); }
      .s0 { fill: var(--chart-1); }
      .s1 { fill: var(--chart-2); }
      .s2 { fill: var(--chart-3); }
      .s3 { fill: var(--chart-4); }
      .s-neutral { fill: var(--chart-other); }
      .band-total {
        fill: var(--chart-1);
        fill-opacity: 40%;
      }
      .edge-total {
        fill: none;
        stroke: var(--chart-1);
        stroke-width: 6;
      }
      .dot-total { fill: var(--chart-1); }
      .footer-link {
        position: absolute;
        right: 64px;
        bottom: 48px;
        color: hsl(var(--foreground));
        font-family: var(--font-mono);
        font-size: 22px;
      }
      .source-line {
        position: absolute;
        left: 64px;
        bottom: 48px;
        color: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 21px;
      }
    </style>
  </head>

        <text class="axis-label" x="82.0" y="722" text-anchor="middle">

        <text class="axis-label" x="285.4" y="722" text-anchor="middle">

      </svg>
      <div class="footer-link">example.com/stats</div>
      <div class="source-line" data-viz-source>Source: Illustrative data</div>
    </main>
  </body>
</html>
