<!doctype html>
<html lang="en" data-viz-kind="chart">
  <body>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .area-fill {
        fill-opacity: 0.08;
      }
      .connector {
        color: hsl(var(--text-faint));
      }
      .accent-surface {
        border-color: var(--primary);
      }
      .chart-series {
        stroke: hsl(var(--accent-foreground));
      }
    </style>
    <svg aria-label="Undeclared literal">
      <circle fill="#666"></circle>
      <path fill="var(--chart-1)" fill-opacity="0.08"></path>
    </svg>
    <style>
      .axis-line {
        stroke: black;
      }
      .grid-mixed {
        stroke: hsl(var(--border));
        fill: black;
      }
      .gridlines-bad {
        stroke: black;
      }
      .local-color {
        --local-color: #123456;
        color: var(--local-color);
      }
      .raw-border {
        border: 1px solid #abcdef;
      }
      .raw-border-top {
        border-top-color: #123456;
      }
      .named-missed {
        color: rebeccapurple;
      }
      .bad-shorthand {
        border: 1px solid var(--border);
      }
      .bad-gradient {
        background: linear-gradient(var(--border), transparent);
      }
      .chart-axis-bad {
        stroke: black;
      }
      .prefixed-gridline-bad {
        stroke: black;
      }
      .compound-axis-line-bad {
        stroke: black;
      }
      .axis-mixed-neutral-data {
        stroke: color-mix(in srgb, var(--chart-1) 50%, hsl(var(--border)));
      }
      .camelCaseAxis {
        stroke: black;
      }
      .background-image-bad {
        background-image: linear-gradient(rebeccapurple, transparent);
      }
      .shadow-bad {
        box-shadow: 0 0 4px rgb(1, 2, 3);
      }
      .area-fill-percent-bad {
        fill-opacity: 13%;
      }
      .area-band-opacity-bad {
        fill-opacity: 13%;
      }
      .mixed-function {
        background: color-mix(in srgb, hsl(var(--border)) 50%, rgb(1, 2, 3));
      }
      .local-literal {
        --local-color: hsl(var(--border), rgb(1, 2, 3));
      }
      .connector-bad {
        stroke: var(--chart-1);
      }
    </style>
    <div class="grid-mixed" style="background: rgb(1, 2, 3)"></div>
    <line class="axis-inline" style="stroke: black"></line>
    <div class="gridlines-bad"></div>
    <div class="local-color"></div>
    <div class="raw-border"></div>
    <div class="named-missed"></div>
    <svg><circle class="chart-series" fill="var(--chart-1)"></circle></svg>
  </body>
</html>
