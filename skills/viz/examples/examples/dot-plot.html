<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8" />
    <title>Ranked progression example</title>
    <style>
      :root { color-scheme: light; font-family: var(--font-sans); }
      body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; color: hsl(var(--foreground)); font-family: var(--font-sans); }
      .frame { position: relative; box-sizing: border-box; height: 100%; padding: 96px 80px 32px; }
      .source-line { position: absolute; bottom: 32px; left: 80px; color: hsl(var(--muted-foreground)); font-family: var(--font-mono); font-size: 12px; line-height: 1.2; }
      .eyebrow { color: hsl(var(--muted-foreground)); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 20px; font-size: 42px; letter-spacing: -.03em; }
      .plot { width: 1120px; height: 470px; }
      .gridline, .row-separator { stroke: hsl(var(--border)); stroke-dasharray: 3 3; }
      .axis-label, .legend, .entity-label { fill: hsl(var(--muted-foreground)); font-size: 14px; }
      .axis-label, .value-labels { text-anchor: middle; }
      .progression-line { stroke: hsl(var(--muted-foreground)); stroke-width: 2; }
      .point-single { fill: var(--chart-ramp-1); } .point-short { fill: var(--chart-ramp-2); }
      .point-core { fill: var(--chart-ramp-3); } .point-long { fill: var(--chart-ramp-4); }
      .value-single { fill: var(--chart-ramp-1); } .value-short { fill: var(--chart-ramp-2); }
      .value-core { fill: var(--chart-ramp-3); } .value-long { fill: var(--chart-ramp-4); }
      .legend-single { fill: var(--chart-ramp-1); } .legend-short { fill: var(--chart-ramp-2); }
      .legend-core { fill: var(--chart-ramp-3); } .legend-long { fill: var(--chart-ramp-4); }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="eyebrow">Team ranking</div>
      <h1>Scores rise with each quarter</h1>
      <svg
        class="plot"
        viewBox="0 0 1120 470"
        role="img"
        aria-label="Ranked multi-point dot plot by quarter"
      >
        <g class="gridlines">
          <line class="gridline" x1="220" y1="50" x2="220" y2="430"></line>
          <line class="gridline" x1="610" y1="50" x2="610" y2="430"></line>
          <line class="gridline" x1="1000" y1="50" x2="1000" y2="430"></line>
        </g>
        <g class="row-separators">
          <line
            class="row-separator"
            x1="80"
            y1="130"
            x2="1030"
            y2="130"
          ></line>
          <line
            class="row-separator"
            x1="80"
            y1="230"
            x2="1030"
            y2="230"
          ></line>
          <line
            class="row-separator"
            x1="80"
            y1="330"
            x2="1030"
            y2="330"
          ></line>
        </g>
        <g class="axis-labels">
          <text class="axis-label" x="220" y="468">0</text>
          <text class="axis-label" x="610" y="468">50</text>
          <text class="axis-label" x="1000" y="468">100</text>
        </g>
        <g class="entity-labels">
          <text class="entity-label" x="80" y="95">Atlas</text>
          <text class="entity-label" x="80" y="195">Beacon</text>
          <text class="entity-label" x="80" y="295">Cedar</text>
          <text class="entity-label" x="80" y="395">Delta</text>
        </g>
        <g class="rows">
          <line
            class="progression-line"
            x1="345"
            y1="90"
            x2="875"
            y2="90"
          ></line>
          <line
            class="progression-line"
            x1="392"
            y1="190"
            x2="828"
            y2="190"
          ></line>
          <line
            class="progression-line"
            x1="298"
            y1="290"
            x2="758"
            y2="290"
          ></line>
          <line
            class="progression-line"
            x1="446"
            y1="390"
            x2="922"
            y2="390"
          ></line>
          <circle class="point-single" cx="345" cy="90" r="8"></circle>
          <circle class="point-short" cx="540" cy="90" r="8"></circle>
          <circle class="point-core" cx="711" cy="90" r="8"></circle>
          <circle class="point-long" cx="875" cy="90" r="8"></circle>
          <circle class="point-single" cx="392" cy="190" r="8"></circle>
          <circle class="point-short" cx="571" cy="190" r="8"></circle>
          <circle class="point-core" cx="688" cy="190" r="8"></circle>
          <circle class="point-long" cx="828" cy="190" r="8"></circle>
          <circle class="point-single" cx="298" cy="290" r="8"></circle>
          <circle class="point-short" cx="493" cy="290" r="8"></circle>
          <circle class="point-core" cx="633" cy="290" r="8"></circle>
          <circle class="point-long" cx="758" cy="290" r="8"></circle>
          <circle class="point-single" cx="446" cy="390" r="8"></circle>
          <circle class="point-short" cx="610" cy="390" r="8"></circle>
          <circle class="point-core" cx="782" cy="390" r="8"></circle>
          <circle class="point-long" cx="922" cy="390" r="8"></circle>
        </g>
        <g class="value-labels">
          <text class="value-single" x="345" y="72">16</text>
          <text class="value-short" x="540" y="72">41</text>
          <text class="value-core" x="711" y="72">63</text>
          <text class="value-long" x="875" y="72">84</text>
          <text class="value-single" x="392" y="172">22</text>
          <text class="value-short" x="571" y="172">45</text>
          <text class="value-core" x="688" y="172">60</text>
          <text class="value-long" x="828" y="172">78</text>
          <text class="value-single" x="298" y="272">10</text>
          <text class="value-short" x="493" y="272">35</text>
          <text class="value-core" x="633" y="272">53</text>
          <text class="value-long" x="758" y="272">69</text>
          <text class="value-single" x="446" y="372">29</text>
          <text class="value-short" x="610" y="372">50</text>
          <text class="value-core" x="782" y="372">72</text>
          <text class="value-long" x="922" y="372">90</text>
        </g>
        <g class="legend">
          <circle class="legend-single" cx="240" cy="20" r="7"></circle>
          <text x="256" y="25">Q1</text>
          <circle class="legend-short" cx="340" cy="20" r="7"></circle>
          <text x="356" y="25">Q2</text>
          <circle class="legend-core" cx="440" cy="20" r="7"></circle>
          <text x="456" y="25">Q3</text>
          <circle class="legend-long" cx="540" cy="20" r="7"></circle>
          <text x="556" y="25">Q4</text>
        </g>
      </svg>
      <div class="source-line" data-viz-source>
        Source: Example internal data, Aug 2026
      </div>
    </main>
  </body>
</html>
