<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8" />
    <title>Stacked ranking example</title>
    <style>
      :root { color-scheme: light; font-family: var(--font-sans); }
      body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; color: hsl(var(--foreground)); font-family: var(--font-sans); }
      .frame { position: relative; box-sizing: border-box; height: 100%; padding: 96px 80px 32px; }
      .source-line { position: absolute; bottom: 32px; left: 80px; color: hsl(var(--muted-foreground)); font-family: var(--font-mono); font-size: 12px; line-height: 1.2; }
      .eyebrow { color: hsl(var(--muted-foreground)); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 20px; font-size: 42px; letter-spacing: -.03em; }
      .plot { width: 1120px; height: 470px; }
      .gridline { stroke: hsl(var(--border)); stroke-dasharray: 3 3; }
      .axis-label, .legend { fill: hsl(var(--muted-foreground)); font-size: 14px; }
      .bar-a { fill: var(--chart-1); stroke: var(--chart-1); }
      .bar-b { fill: var(--chart-2); stroke: var(--chart-2); }
      .bar-c { fill: var(--chart-3); stroke: var(--chart-3); }
      .bar-d { fill: var(--chart-4); stroke: var(--chart-4); }
      .legend-a { fill: var(--chart-1); } .legend-b { fill: var(--chart-2); }
      .legend-c { fill: var(--chart-3); } .legend-d { fill: var(--chart-4); }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="eyebrow">Provider share over time</div>
      <h1>Ranking mix stays balanced</h1>
      <svg
        class="plot"
        viewBox="0 0 1120 470"
        role="img"
        aria-label="One hundred percent stacked provider share chart"

        <g class="gridlines">

          <line class="gridline" x1="90" y1="190" x2="1030" y2="190"></line>
          <line class="gridline" x1="90" y1="270" x2="1030" y2="270"></line>

        </g>
        <g class="axis-labels">

          <text class="axis-label" x="76" y="195" text-anchor="end">50%</text>
