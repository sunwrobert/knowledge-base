<!doctype html>
<html lang="en" data-viz-kind="diagram">
  <head>
    <meta charset="utf-8" />
    <title>Diagram example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: var(--font-sans);
      }
      .dark {
        color-scheme: dark;
      }
      body {
        width: 1280px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
      }
      .frame {
        box-sizing: border-box;
        height: 100%;
        padding: 64px 80px;
      }
      .eyebrow {
        color: hsl(var(--muted-foreground));
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 28px;
        font-size: 42px;
        letter-spacing: -0.03em;
      }
      .diagram {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 36px;
        align-items: center;
        height: 400px;
      }
      .node {
        position: relative;
        box-sizing: border-box;
        min-height: 180px;
        padding: 32px;
        border: 1px solid hsl(var(--border));
        border-radius: 18px;
        background: hsl(var(--background));
      }
      .node.primary {
        border-color: hsl(var(--primary));
        background: color-mix(in srgb, hsl(var(--primary)) 12%, transparent);
      }
      .node:not(:last-child)::after {
        position: absolute;
        top: 50%;
        right: -36px;
        width: 36px;
        height: 2px;
        background: hsl(var(--muted-foreground));
        content: "";
      }
      .node-label {
        margin-bottom: 14px;
        color: hsl(var(--muted-foreground));
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .node-title {
        font-size: 26px;
        font-weight: 700;
      }
      .node-copy {
        margin-top: 12px;
        color: hsl(var(--muted-foreground));
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="eyebrow">Job lifecycle</div>
      <h1>One queue, many workers</h1>
      <section class="diagram" aria-label="Job flow diagram">
        <article class="node">
          <div class="node-label">Input</div>
          <div class="node-title">Producer</div>
          <div class="node-copy">Each job enters one queue.</div>
        </article>
        <article class="node primary">
          <div class="node-label">Scheduler</div>
          <div class="node-title">Queue</div>
          <div class="node-copy">
            Retries, ordering, and backpressure stay in one place.
          </div>
        </article>
        <article class="node">
          <div class="node-label">Execution</div>
          <div class="node-title">Workers</div>
          <div class="node-copy">The next free worker runs the job.</div>
        </article>
      </section>
    </main>
  </body>
</html>
