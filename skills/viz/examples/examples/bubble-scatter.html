<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8" />
    <title>Bubble ranking example</title>
    <style>
      :root { color-scheme: light; font-family: var(--font-sans); }
      body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; color: hsl(var(--foreground)); font-family: var(--font-sans); }
      .frame { position: relative; box-sizing: border-box; height: 100%; padding: 96px 80px 32px; }
      .source-line { position: absolute; bottom: 32px; left: 80px; color: hsl(var(--muted-foreground)); font-family: var(--font-mono); font-size: 12px; line-height: 1.2; }
      .eyebrow { color: hsl(var(--muted-foreground)); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 20px; font-size: 42px; letter-spacing: -.03em; }
      .plot { width: 1120px; height: 470px; }
      .gridline { stroke: hsl(var(--border)); stroke-dasharray: 3 3; }
      .axis-label, .legend { fill: hsl(var(--muted-foreground)); font-size: 14px; }
      .bubble { stroke: hsl(var(--background)); stroke-width: 3; }
      .entity-atlas { fill: var(--chart-1); }
      .entity-beacon { fill: var(--chart-2); }
      .entity-cedar { fill: var(--chart-3); }
      .entity-delta { fill: var(--chart-4); }
      .legend-atlas { fill: var(--chart-1); } .legend-beacon { fill: var(--chart-2); }
      .legend-cedar { fill: var(--chart-3); } .legend-delta { fill: var(--chart-4); }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="eyebrow">Entity performance</div>
      <h1>Throughput rises with value</h1>
      <svg
        class="plot"
        viewBox="0 0 1120 470"
        role="img"
        aria-label="Bubble scatter of price and throughput with volume encoded by area"
      >
        <g class="gridlines">
          <line class="gridline" x1="100" y1="30" x2="1030" y2="30"></line>
          <line class="gridline" x1="100" y1="105" x2="1030" y2="105"></line>
          <line class="gridline" x1="100" y1="180" x2="1030" y2="180"></line>
          <line class="gridline" x1="100" y1="255" x2="1030" y2="255"></line>
          <line class="gridline" x1="100" y1="330" x2="1030" y2="330"></line>
          <line class="gridline" x1="100" y1="30" x2="100" y2="330"></line>
          <line class="gridline" x1="333" y1="30" x2="333" y2="330"></line>
          <line class="gridline" x1="566" y1="30" x2="566" y2="330"></line>
          <line class="gridline" x1="799" y1="30" x2="799" y2="330"></line>
          <line class="gridline" x1="1030" y1="30" x2="1030" y2="330"></line>
        </g>
        <g class="axis-labels">
          <text class="axis-label" x="100" y="350" text-anchor="middle">
            $0.00
          </text>
          <text class="axis-label" x="566" y="350" text-anchor="middle">
            $0.05
          </text>
          <text class="axis-label" x="1030" y="350" text-anchor="middle">
            $0.10
          </text>
          <text
            class="axis-label"
            x="45"
            y="180"
            text-anchor="middle"
            transform="rotate(-90 45 180)"
          >
            Throughput (req/s)
          </text>
          <text class="axis-label" x="566" y="380" text-anchor="middle">
            Price (USD / 1M tokens)
          </text>
          <text class="axis-label" x="88" y="334" text-anchor="end">0</text>
          <text class="axis-label" x="88" y="259" text-anchor="end">25</text>
          <text class="axis-label" x="88" y="184" text-anchor="end">50</text>
          <text class="axis-label" x="88" y="109" text-anchor="end">75</text>
          <text class="axis-label" x="88" y="34" text-anchor="end">100</text>
        </g>
        <g class="bubbles">
          <circle class="bubble entity-atlas" cx="250" cy="230" r="34"></circle>
          <circle
            class="bubble entity-beacon"
            cx="470"
            cy="150"
            r="50"
          ></circle>
          <circle class="bubble entity-cedar" cx="700" cy="100" r="28"></circle>
          <circle class="bubble entity-delta" cx="880" cy="72" r="42"></circle>
          <circle class="bubble entity-atlas" cx="600" cy="220" r="22"></circle>
        </g>
        <g class="legend">
          <circle class="legend-atlas" cx="120" cy="420" r="7"></circle>
          <text x="136" y="425">Atlas</text>
          <circle class="legend-beacon" cx="220" cy="420" r="7"></circle>
          <text x="236" y="425">Beacon</text>
          <circle class="legend-cedar" cx="340" cy="420" r="7"></circle>
          <text x="356" y="425">Cedar</text>
          <circle class="legend-delta" cx="440" cy="420" r="7"></circle>
          <text x="456" y="425">Delta</text>
        </g>
      </svg>
      <div class="source-line" data-viz-source>
        Source: Example internal data, Aug 2026
      </div>
    </main>
  </body>
</html>
