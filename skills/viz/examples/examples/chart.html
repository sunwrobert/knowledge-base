<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8" />
    <title>Chart example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: var(--font-sans);
      }
      .dark {
        color-scheme: dark;
      }
      body {
        width: 1280px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
      }
      .frame {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 96px 80px 32px;
      }
      .source-line {
        position: absolute;
        bottom: 32px;
        left: 80px;
        color: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.2;
      }
      .eyebrow {
        color: hsl(var(--muted-foreground));
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 28px;
        font-size: 42px;
        letter-spacing: -0.03em;
      }
      .plot {
        width: 1120px;
        height: 470px;
        overflow: visible;
      }
      .axis-label,
      .legend {
        fill: hsl(var(--muted-foreground));
        font-size: 14px;
      }
      .gridline {
        stroke: hsl(var(--border));
        stroke-dasharray: 3 3;
      }
      .axis-line {
        stroke: hsl(var(--border));
      }
      .series-atlas {
        fill: none;
        stroke: var(--chart-1);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
      }
      .series-beacon {
        fill: none;
        stroke: var(--chart-2);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
      }
      .legend-atlas {
        fill: var(--chart-1);
      }
      .legend-beacon {
        fill: var(--chart-2);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="eyebrow">Activity overview</div>
      <h1>Usage keeps pace with demand</h1>
      <svg
        class="plot"
        viewBox="0 0 1120 470"
        role="img"
        aria-label="Two-series usage chart for Atlas and Beacon"
      >
        <g class="grid">
          <line class="gridline" x1="80" y1="30" x2="980" y2="30"></line>
          <line class="gridline" x1="80" y1="130" x2="980" y2="130"></line>
          <line class="gridline" x1="80" y1="230" x2="980" y2="230"></line>
          <line class="gridline" x1="80" y1="330" x2="980" y2="330"></line>
        </g>
        <g class="axis">
          <line class="axis-line" x1="80" y1="30" x2="80" y2="330"></line>
          <line class="axis-line" x1="80" y1="330" x2="980" y2="330"></line>
          <text class="axis-label" x="68" y="338" text-anchor="end">0</text>
          <text class="axis-label" x="68" y="238" text-anchor="end">25</text>
          <text class="axis-label" x="68" y="138" text-anchor="end">50</text>
          <text class="axis-label" x="68" y="38" text-anchor="end">75</text>
          <text class="axis-label" x="80" y="364">Jan</text>
          <text class="axis-label" x="368" y="364">Feb</text>
          <text class="axis-label" x="656" y="364">Mar</text>
          <text class="axis-label" x="944" y="364">Apr</text>
        </g>
        <polyline
          class="series-atlas"
          points="80,260 180,236 280,248 380,192 480,206 580,155 680,170 780,118 880,134 980,78"
        ></polyline>
        <polyline
          class="series-beacon"
          points="80,294 180,280 280,268 380,242 480,228 580,210 680,188 780,170 880,154 980,140"
        ></polyline>
        <g class="legend">
          <circle class="legend-atlas" cx="80" cy="410" r="7"></circle>
          <text x="96" y="415">Atlas</text>
          <circle class="legend-beacon" cx="210" cy="410" r="7"></circle>
          <text x="226" y="415">Beacon</text>
        </g>
      </svg>
      <div class="source-line" data-viz-source>
        Source: Example internal data, Aug 2026
      </div>
    </main>
  </body>
</html>
